function image(s,got){return got?`<img src="${D.images[s.image]}" class="sil" alt="ナワモンのシルエット" loading="lazy">`:'<div class="unknown" role="img" aria-label="まだゲットしていないナワモン">？</div>'}
const day=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));const date=d=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d));
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='dex'){let visible=D.skills.filter(s=>state.ex||s.kind!=='EX'),got=visible.filter(s=>stat(s.id).got).length;$('#view').innerHTML=`<section class="hero"><p>${esc(state.nickname||'NAWAMON CHALLENGE')}</p><h1>シルエットを<br>あつめよう。</h1><p>まだのわざは「？」。できたらシルエットをゲット！</p><p class="stats">${got} / ${visible.length} 技ゲット ・ きょう ${state.records.filter(r=>day(r.date)===day(new Date())).length} 件の記録</p></section><h2>ナワモンずかん</h2><div class="bar"><input id="search" type="search" aria-label="わざの名前でさがす" placeholder="わざの名前でさがす" value="${esc(query)}"><select id="direction" aria-label="回す方向"><option value="">回し方すべて</option>${['前回し','後ろ回し','指定なし'].map(d=>`<option ${direction===d?'selected':''}>${d}</option>`).join('')}</select><select id="mode" aria-label="ゲットのようす">${[['all','ぜんぶ'],['got','ゲットずみ'],['new','まだ']].map(([v,t])=>`<option value="${v}" ${mode===v?'selected':''}>${t}</option>`).join('')}</select></div><p id="countline" class="muted" aria-live="polite"></p><div id="grid" class="grid"></div><div id="pages" class="pages"></div>`;$('#search').oninput=e=>{query=e.target.value;page=0;grid()};$('#direction').onchange=e=>{direction=e.target.value;page=0;grid()};$('#mode').onchange=e=>{mode=e.target.value;page=0;grid()};grid()}else if(tab==='records'){const rs=[...state.records].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<section class="panel"><h2>チャレンジのきろく</h2><p>${rs.length}件。できた日も、れんしゅうした日も。</p>${rs.slice(0,300).map(r=>{let s=byId.get(r.skillId);return `<article class="row"><button data-delete="${r.id}">削除</button><small>${date(r.date)} ・ ${r.achieved?'できた！':'れんしゅう'}</small><p><b>${esc(s.name)}</b>（${esc(s.direction)}） ${r.count===null?'':r.count+'回'}</p><p>${esc(r.note)}</p></article>`}).join('')||'<p>図鑑からわざをえらんで、最初の記録をしよう。</p>'}${rs.length>300?'<p>画面には新しい300件を表示。すべての記録はCSV・JSONに含まれます。</p>':''}</section>`}else{const ss=D.skills.filter(s=>stat(s.id).n);$('#view').innerHTML=`<section class="panel"><h1>はかせのレポート</h1><p>${esc(state.nickname||'ななしのチャレンジャー')} ・ ${day(new Date())}</p><p><b>${ss.filter(s=>stat(s.id).got).length}技ゲット ／ ${state.records.length}件のチャレンジ</b></p><p class="notice">軽量版は先生への自動送信はありません。画面を見せるか、CSVを保存して先生へわたしてください。記録は自己申告です。</p><div class="actions"><button class="primary" data-export="csv">レポート保存（CSV）</button><button id="print">印刷</button></div><div style="overflow:auto"><table><tr><th>わざ</th><th>方向</th><th>ようす</th><th>ベスト</th></tr>${ss.map(s=>{let st=stat(s.id);return `<tr><td>${esc(s.name)}</td><td>${esc(s.direction)}</td><td>${st.got?'ゲット！':'練習中'}</td><td>${st.best===null?'―':st.best+'回'}</td></tr>`}).join('')}</table></div></section><section class="panel no-print"><h2>記録をなくさないために</h2><p>端末を替える前などにバックアップを保存し、設定から読みこんでください。</p><button data-export="json">バックアップ保存（JSON）</button></section>`;$('#print').onclick=()=>window.print()}}
function grid(){const q=query.trim().normalize('NFKC').toLowerCase(),rows=D.skills.filter(s=>(state.ex||s.kind!=='EX')&&(!q||(s.name+' '+(stat(s.id).got?s.monster:'')).normalize('NFKC').toLowerCase().includes(q))&&(!direction||(direction==='指定なし'?!['前回し','後ろ回し'].includes(s.direction):direction===s.direction))&&(mode==='all'||(mode==='got'?stat(s.id).got:!stat(s.id).got)));const pages=Math.max(1,Math.ceil(rows.length/24));page=Math.min(page,pages-1);$('#countline').textContent=rows.length+'のわざ';$('#grid').innerHTML=rows.slice(page*24,page*24+24).map(s=>{const st=stat(s.id);return `<button class="card" data-skill="${s.id}"><span class="meta">No.${String(s.number).padStart(3,'0')} ${s.kind==='EX'?'・ EX':''} ${st.got?'・ ゲット！':''}</span>${image(s,st.got)}<h3>${esc(s.name)}</h3><span class="meta">${st.got?esc(s.monster||'名前はじゅんび中'):'？？？'}</span><span class="bottom meta"><span>${esc(s.direction)}</span><b>${st.best!==null?st.best+'回':''}</b></span></button>`}).join('')||'<p>この条件のわざはありません。</p>';$('#pages').innerHTML=`<button data-page="-1" ${page===0?'disabled':''}>まえ</button><span>${page+1} / ${pages}</span><button data-page="1" ${page===pages-1?'disabled':''}>つぎ</button>`}
function openSkill(id){let s=byId.get(id),st=stat(id);$('#detail').innerHTML=`<button class="close" data-close="detail" aria-label="とじる">×</button><h2 id="detail-title">${esc(s.name)}</h2><p class="muted">${esc(s.direction)} ・ ${s.kind}</p>${image(s,st.got)}<p style="text-align:center">${st.got?esc(s.monster||'名前はじゅんび中'):'できた！を記録するとシルエットが見られるよ。'}</p>${!s.hasArt?'<p class="muted">このわざの絵はじゅんび中です。</p>':''}<b>わざのヒント（説明案）</b><p>${esc(s.description)}</p><div class="actions">${s.video?`<a class="btn primary" href="${esc(s.video)}" target="_blank" rel="noopener noreferrer">動画をひらく</a>`:''}<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">参考ページをひらく</a></div><p class="muted">${esc(s.source)}<br>${esc(s.videoNote)}<br>動画は参考ページ内からえらびます。インターネット接続が必要です。</p><form id="record-form"><label class="field">できた回数（空らんでもOK）<input id="times" inputmode="numeric" maxlength="5" placeholder="例：10"></label><label class="field">ひとこと（なくてもOK）<textarea id="note" maxlength="120"></textarea></label><p id="form-error" class="notice error" hidden role="alert"></p><div class="actions"><button class="primary" name="outcome" value="got">できた！を記録</button><button name="outcome" value="practice">れんしゅうを記録</button></div></form>`;$('#detail').showModal();$('#record-form').onsubmit=e=>{e.preventDefault();let achieved=e.submitter?.value!=='practice',raw=$('#times').value.trim(),count=raw===''?null:Number(raw);if(raw!==''&&(!/^\d{1,5}$/.test(raw)||count<(achieved?1:0))){$('#form-error').textContent='回数は'+(achieved?'1':'0')+'〜99999の整数か、空らんにしてください。';$('#form-error').hidden=false;return}let note=$('#note').value.trim();if(commit(s=>{s.records.push({id:crypto.randomUUID?crypto.randomUUID():'r_'+Date.now()+'_'+Math.random().toString(36).slice(2),skillId:id,achieved,count,note,date:new Date().toISOString()});return s})){$('#detail').close();render();say(achieved?'できた！を記録したよ。':'れんしゅうを記録したよ。')}}}
function save(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);say('ファイルを作成しました。保存先を確認してください。')}
const stamp=()=>new Date().toISOString().replace(/[^0-9]/g,'').slice(0,14),cell=v=>'"'+String(v??'').replace(/^(\s*[=+@-])/g,"'$1").replace(/"/g,'""')+'"';
function exp(type){if(type==='json')save('nawamon_silhouette_backup_'+stamp()+'.json',JSON.stringify({schema:'nawamon-silhouette-lite-backup/1',state},null,2),'application/json');else{let rows=[['記録ID','技ID','技名','方向','結果','回数','日時（日本時間）','ひとこと','ニックネーム','確認方法'],...state.records.map(r=>[r.id,r.skillId,byId.get(r.skillId).name,byId.get(r.skillId).direction,r.achieved?'できた':'れんしゅう',r.count,date(r.date),r.note,state.nickname,'自己申告'])];save('nawamon_silhouette_report_'+stamp()+'.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}}
function config(){$('#config').innerHTML=`<button class="close" data-close="config" aria-label="とじる">×</button><h2 id="config-title">設定と使い方</h2><form id="settings-form"><label class="field">ニックネーム（なくてもOK）<input id="nick" maxlength="20" value="${esc(state.nickname)}"></label><label class="check"><input id="ex" type="checkbox" ${state.ex?'checked':''}>EX45技も表示する</label><p class="muted">最初は通常91技。設定はこの端末だけに保存します。</p><button class="primary">設定を保存</button></form><h3>バックアップ</h3><button data-export="json">JSONを保存</button>${blocked?'<button id="raw">元データを保存</button>':''}<label class="field">バックアップJSONを読みこむ<input id="import" type="file" accept=".json,application/json"></label><p id="import-result" role="status"></p><p class="muted">今の記録に追加します。同じ記録は1件にまとめます。このシルエット軽量版専用です。ほかの版の記録は読みこみません。</p><details><summary>使い方・この版の範囲</summary><ol><li>図鑑からわざをえらび、説明や参考動画を見る。</li><li>回数（空らん可）を入れて「できた！」を記録。</li><li>はかせのレポートを保存し、先生へ見せる。</li></ol><p>1台・1ブラウザに1人分を保存。ブラウザのデータを消す前にはJSONを保存してください。</p><p>未ゲットは「？」、ゲット後もシルエットだけの図鑑です。カラー画像は含みません。レベルアップ・進化・先生や友達の認定・自動送信・学級集計は含みません。</p><p>技説明136件、参考ページ136件、YouTube直接リンク3件。説明は案のまま保持しています。後ろ回しの参考ページが共通の技もあります。</p><p>iPadではSafariで配信用URLを開き、共有からホーム画面に追加します。初回は下部が「オフラインでつかえます」になるまで接続してください。iPadのファイルアプリでHTMLを直接開く方法は、PWAの配布方法にはなりません。</p></details>`;$('#config').showModal();$('#settings-form').onsubmit=e=>{e.preventDefault();let nickname=$('#nick').value.trim(),ex=$('#ex').checked;if(commit(s=>({...s,nickname,ex}))){$('#config').close();page=0;render()}};$('#raw')?.addEventListener('click',()=>save('original.txt',localStorage.getItem(KEY)||'','text/plain'));$('#import').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;if(file.size>30*1024*1024)throw Error('ファイルが大きすぎます。');let raw=JSON.parse(await file.text());if(raw.schema!=='nawamon-silhouette-lite-backup/1')throw Error('シルエット軽量版専用のバックアップJSONをえらんでください。');let incoming=validate(raw.state),added=0;if(commit(s=>{let map=new Map(s.records.map(r=>[r.id,r]));for(let r of incoming.records){if(map.has(r.id)&&JSON.stringify(map.get(r.id))!==JSON.stringify(r))throw Error('同じ記録IDで内容が違います。');if(!map.has(r.id)){map.set(r.id,r);added++}}return {...s,nickname:s.nickname||incoming.nickname,ex:s.ex||incoming.ex,records:[...map.values()]}},blocked)){$('#import-result').textContent=added+'件を追加しました。';render()}}catch(err){$('#import-result').textContent=err.message}e.target.value=''}}
$('#settings').onclick=config;document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.skill)openSkill(b.dataset.skill);if(b.dataset.close)$('#'+b.dataset.close).close();if(b.dataset.page){page+=Number(b.dataset.page);grid()}if(b.dataset.export)exp(b.dataset.export);if(b.dataset.delete&&confirm('この記録を削除しますか？ 最後のできた記録を削除すると「？」に戻ります。')){if(commit(s=>({...s,records:s.records.filter(r=>r.id!==b.dataset.delete)})))render()}});window.addEventListener('storage',e=>{if(e.key===KEY)try{state=e.newValue?validate(JSON.parse(e.newValue)):empty();render()}catch(_){say('別の画面の記録を読みこめませんでした。')}});render();if(location.protocol!=='file:'&&'serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(async()=>{const c=await caches.open('nawamon-silhouette-lite-v1');if(!(await c.match('index.html')))throw Error('cache missing');$('#offline').textContent='オフラインでつかえます（動画は接続が必要です）'}).catch(()=>{$('#offline').textContent='オフラインの準備ができませんでした。接続中に開き直してください。'})}else $('#offline').textContent='端末内に保存する確認版。PWAとして使う場合は配信用URLから開いてください。';
</script></html>
